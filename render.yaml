services:
  - type: web
    name: capita-ai-backend
    env: node
    plan: free # Change to 'starter' if you need a persistent disk later
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health   # Render pings this to confirm the service is live
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MOCK_EMAIL
        value: "true" # Set to "false" when you configure real SMTP details

      # Environment variables that Render will prompt you for via the Dashboard:
      - key: APP_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      
      # Optional SMTP Settings (If MOCK_EMAIL is false)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
